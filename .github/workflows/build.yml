# Entry point for ghcr.io/gidw/mediamill. The jobs live in image.yml; this file only picks the
# token for each event. Pull requests (including Renovate's, which come from branches in this
# repo) build and smoke-test with a read-only token; only main, the weekly rebuild and manual
# runs may write packages.
name: container

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # weekly no-cache rebuild: refreshes debian/ffmpeg digests + security fixes
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  # Pull requests: a new push supersedes the running check. main: runs queue instead of
  # cancelling, so a push can never kill the weekly no-cache rebuild or a publish half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml

  # The single required status check in the main ruleset. Jobs inside the reusable workflow
  # report as "check / build (...)", which changes with the matrix; this name stays fixed.
  # always(): a skipped job counts as passing, so it must run (and fail) when check fails.
  pr-ok:
    if: always() && github.event_name == 'pull_request'
    needs: check
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.check.result }}" = success

  publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
